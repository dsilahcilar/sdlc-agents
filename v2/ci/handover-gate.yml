# Prints what each pull request owes and where it would go next. Shadow mode: it blocks nothing.
# Copy to .github/workflows/handover-gate.yml.
name: Handover gate

on:
  pull_request:
    # "edited" too: a Waive or Ran line in the pull request text changes the answer.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  owed:
    name: What this change owes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate compares against the branch point, so it needs the history.
          fetch-depth: 0
      - name: Run the gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Passed through the environment, never pasted into the script: the text is written by the author.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # A gate that cannot run (a broken rules file) fails this job. What a change owes never does.
          set -o pipefail
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pull-request.md"
          # The gate and the rules come from the base branch when it has them, so a pull request cannot loosen
          # the rules that judge it. A pull request that brings the gate is judged by its own copy.
          # Two limits. GitHub runs this file as the pull request has it, so a pull request that edits this
          # workflow can print what it likes: read the block of such a pull request with that in mind. And the
          # tip of the base branch is used, not the commit the pull request started from, which can be weeks old.
          RULES_AT=$(git rev-parse -q --verify "refs/remotes/origin/$BASE_REF^{commit}" || echo "$BASE_SHA")
          FROM=.
          if git cat-file -e "$RULES_AT:.sdlc/gate/handover_gate.py" 2>/dev/null \
              && git cat-file -e "$RULES_AT:.sdlc/rules.json" 2>/dev/null; then
            git worktree prune
            git worktree add --force --detach "$RUNNER_TEMP/gate-base" "$RULES_AT" > /dev/null
            FROM="$RUNNER_TEMP/gate-base"
          fi
          python3 "$FROM/.sdlc/gate/handover_gate.py" --rules "$FROM/.sdlc/rules.json" \
            --base "$BASE_SHA" --head "$HEAD_SHA" \
            --pull-request-from "$RUNNER_TEMP/pull-request.md" | tee -a "$GITHUB_STEP_SUMMARY"
          # With a judge (see docs/gates.md), add for example:
          #   --judge-cmd "python3 $FROM/.sdlc/gate/my_judge.py"
          # and pass its key as a secret in `env`. Without a judge only the path rules apply.
          if [ "$FROM" != . ]; then git worktree remove --force "$FROM"; fi
